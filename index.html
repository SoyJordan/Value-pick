<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Value Pick</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#111827;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0;padding-bottom:40px}.app{max-width:760px;margin:auto;padding:16px}
header{padding:12px 2px 8px}h1{margin:0;font-size:30px}h2{font-size:20px;margin:0 0 14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:12px;font-weight:700;display:block}input,select,textarea{width:100%;margin-top:5px;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}
textarea{min-height:70px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;font-size:15px;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}
.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #eee;text-align:left}.good{background:#dcfce7}.watch{background:#fef3c7}.bad{background:#fee2e2}
.metric{display:inline-block;background:#eef2ff;border-radius:10px;padding:8px;margin:4px 4px 0 0;font-size:13px}.muted{color:#6b7280}.hidden{display:none}
.small{font-size:12px}.danger{color:#b91c1c}.success{color:#166534}
@media(max-width:500px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:12px}}
</style></head>
<body><main class="app">
<header><h1>⚽ Value Pick</h1><div class="muted">V1.3 · local · sin hosting · sin APIs</div></header>
<div class="nav"><button onclick="show('analysis')">Nuevo análisis</button><button class="secondary" onclick="show('history')">Historial</button><button class="secondary" onclick="show('backup')">Datos</button></div>

<section id="analysis">
<form id="form">
<div class="card"><h2>Partido</h2><div class="grid">
<label>Fecha<input id="date" type="date" required></label><label>Liga<input id="league" required></label>
<label>Temporada<input id="season" value="2026"></label><label>Promedio goles liga<input id="leagueAvg" type="number" step=".01" value="1.35"></label>
<label>Local<input id="home" required></label><label>Visitante<input id="away" required></label>
<label class="full">Notas<textarea id="notes" placeholder="Contexto objetivo"></textarea></label></div></div>

<div id="teamCards"></div>

<div class="card"><h2>💰 Cuotas</h2><p class="small muted">Introduce solo las cuotas que quieras comparar.</p><div id="odds"></div></div>
<button style="width:100%">ANALIZAR Y GUARDAR</button>
</form><div id="result"></div></section>

<section id="history" class="hidden"><div class="card"><h2>📚 Historial</h2><div id="stats"></div><div id="historyTable"></div></div></section>
<section id="backup" class="hidden"><div class="card"><h2>💾 Datos</h2><p>Todo queda guardado en este iPhone. Exporta una copia periódicamente.</p>
<div class="actions"><button onclick="exportData()">Exportar backup</button><label style="display:inline-block"><input id="importFile" type="file" accept=".json" onchange="importData(event)" style="display:none"><button type="button" class="secondary" onclick="document.getElementById('importFile').click()">Importar backup</button></label><button class="secondary" onclick="clearAll()">Borrar datos</button></div><p id="dataMsg" class="small"></p></div></section>
</main>
<script>
const periods=[["season","Temporada"],["last10","Últimos 10"],["last5","Últimos 5"]];
const metrics=[["gf","GF"],["ga","GA"],["xg","xG"],["xga","xGA"],["shots","Tiros"],["sot","Tiros al arco"],["sa","Tiros recibidos"],["sota","Tiros al arco recibidos"],["bc","Ocasiones claras"],["bca","Ocasiones concedidas"],["rest","Días descanso"],["attAbs","Ausencias ataque"],["defAbs","Ausencias defensa"]];
const markets=[["1X2","home","Local"],["1X2","draw","Empate"],["1X2","away","Visitante"],["TOTAL","over15","Over 1.5"],["TOTAL","under15","Under 1.5"],["TOTAL","over25","Over 2.5"],["TOTAL","under25","Under 2.5"],["TOTAL","over35","Over 3.5"],["TOTAL","under35","Under 3.5"],["BTTS","bttsYes","BTTS Sí"],["BTTS","bttsNo","BTTS No"],["DNB","homeDnb","Local DNB"],["DNB","awayDnb","Visitante DNB"],["TEAM","home05","Local Over 0.5"],["TEAM","home15","Local Over 1.5"],["TEAM","away05","Visitante Over 0.5"],["TEAM","away15","Visitante Over 1.5"],["AH","home05plus","Local +0.5"],["AH","away05plus","Visitante +0.5"]];
function build(){let tc=document.getElementById("teamCards");tc.innerHTML="";
for(const [side,title] of [["home","🏠 Local"],["away","✈️ Visitante"]]){let h=`<div class="card"><h2>${title}</h2><table><tr><th>Métrica</th>${periods.map(p=>`<th>${p[1]}</th>`).join("")}</tr>`;
for(const [k,l] of metrics)h+=`<tr><td>${l}</td>${periods.map(p=>`<td><input data-team="${side}" data-period="${p[0]}" data-key="${k}" type="number" step=".01"></td>`).join("")}</tr>`;
tc.innerHTML+=h+"</table></div>";}
document.getElementById("odds").innerHTML=markets.map(x=>`<div class="grid" style="margin:7px 0"><label class="full">${x[0]} · ${x[2]}<input data-odd="${x[1]}" type="number" min="1.01" step=".01" placeholder="Cuota"></label></div>`).join("")}
build(); document.getElementById("date").value=new Date().toISOString().slice(0,10);

function getTeam(side){let d={};for(const p of periods){d[p[0]]={};for(const [k] of metrics){let el=document.querySelector(`[data-team="${side}"][data-period="${p[0]}"][data-key="${k}"]`);d[p[0]][k]=el.value===""?null:+el.value}}return d}
function weighted(d,k){let arr=[["season",.5],["last10",.3],["last5",.2]].filter(x=>d[x[0]][k]!=null);if(!arr.length)return null;let s=arr.reduce((a,x)=>a+x[1],0);return arr.reduce((a,x)=>a+x[1]/s*d[x[0]][k],0)}
function expGoals(h,a,avg){function attack(d){let x=[weighted(d,"xg"),weighted(d,"gf")].filter(v=>v!=null).map(v=>v/avg);return x.length?x.reduce((a,b)=>a+b,0)/x.length:1}function defense(d){let x=[weighted(d,"xga"),weighted(d,"ga")].filter(v=>v!=null).map(v=>v/avg);return x.length?x.reduce((a,b)=>a+b,0)/x.length:1}
let ha=attack(h),aa=attack(a),hd=defense(h),ad=defense(a),hi=Math.max(.85,1-.1*(weighted(h,"attAbs")||0)),ai=Math.max(.85,1-.1*(weighted(a,"attAbs")||0));
return [Math.max(.05,Math.min(4.5,avg*ha*(2-ad)*1.06*hi)),Math.max(.05,Math.min(4.5,avg*aa*(2-hd)*.96*ai))]}
function pois(k,l){return Math.exp(-l)*Math.pow(l,k)/factorial(k)} function factorial(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function probs(hl,al){let m=[];for(let h=0;h<=8;h++)for(let a=0;a<=8;a++)m.push([h,a,pois(h,hl)*pois(a,al)]);let p={home:0,draw:0,away:0,bttsYes:0};m.forEach(([h,a,v])=>{if(h>a)p.home+=v;else if(h==a)p.draw+=v;else p.away+=v;if(h&&a)p.bttsYes+=v});
p.bttsNo=1-p.bttsYes;for(let [k,t] of [["15",2],["25",3],["35",4]]){p["over"+k]=m.filter(x=>x[0]+x[1]>=t).reduce((s,x)=>s+x[2],0);p["under"+k]=1-p["over"+k]}let nd=1-p.draw;p.homeDnb=p.home/nd;p.awayDnb=p.away/nd;p.home05=1-pois(0,hl);p.home15=1-(pois(0,hl)+pois(1,hl));p.away05=1-pois(0,al);p.away15=1-(pois(0,al)+pois(1,al));p.home05plus=p.home+p.draw;p.away05plus=p.away+p.draw;return p}
function score(p,o){let imp=1/o,ed=p-imp,e=p*o-1,vs=Math.max(0,Math.min(100,50+250*e+100*ed));let comp=0,inputs=document.querySelectorAll("input[data-key='xg'],input[data-key='xga']");inputs.forEach(x=>{if(x.value!=="")comp++});comp/=12;let conf=Math.max(0,Math.min(100,40+60*comp));let dec=e>=.07&&ed>=.03&&conf>=70?"VALUE BET":(e>=.03&&ed>=.02?"WATCH":"NO BET");return {p,imp,fair:1/p,ed,e,vs,conf,dec}}
function loadDB(){return JSON.parse(localStorage.getItem("valuePickDB")||"[]")}function saveDB(x){localStorage.setItem("valuePickDB",JSON.stringify(x))}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();let home=document.getElementById("home").value,away=document.getElementById("away").value,hd=getTeam("home"),ad=getTeam("away"),[hl,al]=expGoals(hd,ad,+document.getElementById("leagueAvg").value||1.35),ps=probs(hl,al),rows=[];
document.querySelectorAll("[data-odd]").forEach(el=>{if(el.value&&ps[el.dataset.odd]!=null){let s=score(ps[el.dataset.odd],+el.value);rows.push({...s,market:el.dataset.odd,odds:+el.value})}});
rows.sort((a,b)=>b.vs-a.vs);let rec={id:Date.now(),date:document.getElementById("date").value,league:document.getElementById("league").value,season:document.getElementById("season").value,home,away,hl,al,rows,result:null};let db=loadDB();db.unshift(rec);saveDB(db);renderResult(rec);});
function renderResult(r){let h=`<div class="card"><h2>🎯 Resultado</h2><p><b>${r.home}</b> ${r.hl.toFixed(2)} · ${r.al.toFixed(2)} <b>${r.away}</b></p><table><tr><th>Pick</th><th>Prob.</th><th>Justa</th><th>Cuota</th><th>Edge</th><th>EV</th><th>Value</th><th>Conf.</th><th></th></tr>`;
for(let x of r.rows){h+=`<tr class="${x.dec=='VALUE BET'?'good':x.dec=='WATCH'?'watch':'bad'}"><td>${x.market}</td><td>${(x.p*100).toFixed(1)}%</td><td>${x.fair.toFixed(2)}</td><td>${x.odds.toFixed(2)}</td><td>${(x.ed*100).toFixed(1)}%</td><td>${(x.e*100).toFixed(1)}%</td><td>${x.vs.toFixed(0)}</td><td>${x.conf.toFixed(0)}</td><td><b>${x.dec}</b></td></tr>`}h+="</table></div>";document.getElementById("result").innerHTML=h}
function show(id){["analysis","history","backup"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));if(id==="history")renderHistory()}
function renderHistory(){let db=loadDB(),settled=db.filter(x=>x.result);let wins=settled.filter(x=>x.result==="win").length,loss=settled.filter(x=>x.result==="loss").length,pnl=settled.reduce((s,x)=>s+(x.pnl||0),0),stake=settled.length;document.getElementById("stats").innerHTML=`<span class="metric">Análisis: ${db.length}</span><span class="metric">Liquidados: ${settled.length}</span><span class="metric">Aciertos: ${wins}</span><span class="metric">Fallos: ${loss}</span><span class="metric">PnL: ${pnl.toFixed(2)}u</span><span class="metric">ROI: ${stake?(pnl/stake*100).toFixed(2):"0.00"}%</span>`;let h="<table><tr><th>Fecha</th><th>Partido</th><th>Mejor pick</th><th>Cuota</th><th>EV</th><th>Estado</th><th></th></tr>";db.forEach(r=>{let x=r.rows[0];h+=`<tr><td>${r.date}</td><td>${r.home} vs ${r.away}</td><td>${x?x.market:"-"}</td><td>${x?x.odds.toFixed(2):"-"}</td><td>${x?(x.e*100).toFixed(1)+"%":"-"}</td><td>${r.result||"Pendiente"}</td><td>${x?`<button onclick="settle(${r.id})">Liquidar</button>`:""}</td></tr>`});document.getElementById("historyTable").innerHTML=h+"</table>"}
function settle(id){let db=loadDB(),r=db.find(x=>x.id===id);if(!r||!r.rows.length)return;let x=r.rows[0],res=prompt("Resultado: WIN, LOSS o PUSH","WIN");if(!res)return;res=res.toLowerCase();if(!["win","loss","push"].includes(res))return alert("Resultado inválido");r.result=res;r.pnl=res==="win"?x.odds-1:res==="loss"?-1:0;saveDB(db);renderHistory()}
function exportData(){let b=new Blob([JSON.stringify(loadDB(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ValuePick_Backup.json";a.click();document.getElementById("dataMsg").textContent="Backup exportado."}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d))throw Error();saveDB(d);document.getElementById("dataMsg").textContent="Backup importado correctamente."}catch{document.getElementById("dataMsg").textContent="Archivo no válido."}};rd.readAsText(f)}
function clearAll(){if(confirm("¿Borrar todo el historial de este iPhone?")){localStorage.removeItem("valuePickDB");renderHistory()}}
if("serviceWorker"in navigator && location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
